<body data-level="1" data-screen="title">

<!-- 0.8 / 2.4 the world: the engine's full-bleed host behind every piece of glass -->
<div id="world" aria-hidden="true"></div>

<!-- 2.4 the bridge: status bar · rail + panel host + notices · context bar (hud.js fills each shell) -->
<div id="app">
  <header id="statusbar" class="glass bar" data-hue="amber"><i class="spine"></i></header>
  <div id="condition" role="status" aria-live="polite"></div>
  <div id="main">
    <nav id="rail" class="glass" aria-label="Command rail"></nav>
    <div id="panel-host" hidden>
      <section id="panel" class="glass cut" role="region" aria-label="Panel"></section>
    </div>
    <aside id="notices" aria-label="Notices">
      <div id="toasts" aria-live="polite"></div>
      <div id="nextup" class="glass cut-sm" hidden><i class="spine"></i><div class="nu-head"><span class="nu-title">Next up</span></div><div class="nu-rows"></div></div>
    </aside>
  </div>
  <footer id="contextbar" class="glass bar" data-hue="ice"><i class="spine"></i></footer>
</div>

<!-- 5.3 overlays (overlays.js owns their content) -->
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="box glass cut" data-kind="event"><i class="spine"></i>
    <div class="modal-head"><span class="modal-ic"></span><span id="modal-tag" class="micro"></span></div>
    <div class="modal-body"><h2 id="modal-title"></h2><div id="modal-text" class="body-lg"></div><div id="modal-extra"></div></div>
    <div id="modal-actions"></div>
  </div>
</div>
<div id="sheet" role="dialog" aria-modal="true"><div class="sheet-box glass cut"><i class="spine"></i><div class="sheet-content"></div></div></div>
<div id="celebrate" aria-live="polite"></div>
<div id="tooltip" role="tooltip" class="glass"></div>
<div id="flights" aria-hidden="true"></div>

<!-- 5.4 title screen v2 (main.js wires the buttons; ids are the v1 contract plus resume-rank / resume-name) -->
<div id="title">
  <div class="title-band glass"><i class="sweep"></i>
    <h1 class="wordmark hero">Waystation</h1>
    <div class="title-sub">Station commissioning</div>
    <div class="title-account" id="title-account"></div>
  </div>
  <div class="commission glass cut" data-hue="amber"><i class="spine"></i>
    <div id="title-resume" hidden>
      <button type="button" id="btn-resume" class="resume-card">
        <canvas id="title-thumb" width="200" height="120" aria-hidden="true"></canvas>
        <span class="resume-main">
          <span id="resume-rank" class="resume-rank">Commander</span>
          <span id="resume-name" class="resume-name">&mdash;</span>
          <span id="resume-meta" class="resume-meta"></span>
          <span class="resume-cta">Resume <span class="ic-slot" data-icon="chevron-right"></span></span>
        </span>
      </button>
      <div class="title-actions"><button type="button" id="btn-newstation" class="btn ghost">New profile</button></div>
    </div>
    <div id="title-form">
      <label class="field" for="title-name">Station name</label>
      <div class="name-row">
        <input id="title-name" type="text" class="input" maxlength="28" autocomplete="off" spellcheck="false" aria-describedby="title-registry">
        <button type="button" id="btn-reroll" class="btn icon ghost" title="Another name" aria-label="Another name"><span class="ic-slot" data-icon="reroll"></span></button>
      </div>
      <div id="title-registry" class="micro">Registry WS-0000 will be assigned on commission</div>
      <div id="title-confirm" class="title-confirm" hidden>
        <p class="confirm-text">Your current profile will be replaced. Every sector, rank and reward goes with it.</p>
        <div class="title-actions"><button type="button" id="btn-title-back" class="btn ghost">Back</button></div>
      </div>
      <div class="title-actions"><button type="button" id="btn-commission" class="btn big primary">Commission station</button></div>
    </div>
  </div>
</div>

<!-- 2.4 / A4: phones get the same bridge folded (style.css 30b, hud.js PHONE_MQ), not a message -->

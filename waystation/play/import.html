<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Port Solace · Move your station</title>
<meta name="description" content="Bring a Port Solace station saved at the old address into this browser.">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#04050A">
<meta name="color-scheme" content="dark">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../assets/icon-32.png" sizes="32x32" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<!--
  PORT SOLACE — play/import.html: the receiving end of the move from the old address (migration contract M5)
  The bridge page at https://joshanderson051.github.io/move/ reads that origin's waystation… storage and sends it here as
  #ps-import=g.<base64url gzip JSON> | j.<base64url JSON> | none. This page validates it, maps every key to portsolace…
  (the same mapping as js/migrate.js), keeps only the keys a move needs (MOVE_KEYS: never the apiBase overrides
  portsolace.account.config, portsolace.store or portsolace.push), asks before writing anything (Bring it over, or
  Replace when this browser already holds a different station), writes the keys and opens the game with ?moved=1.
  Too large for a URL, the bridge offers port-solace-station.json instead: the file input takes it.
  No game boot, no PixiJS. Everything in the payload is untrusted: any site can link here with a crafted hash, so
  nothing is written without a click, it is shown with textContent only and capped at 5 MB.
-->
<style>
:root {
  --space: #04050A; --glass: rgba(20,24,31,.86); --line: rgba(243,233,214,.14);
  --amber: #E9A23B; --amber-hi: #FFC46A; --ivory: #F3E9D6; --ink: #E6E8EC; --ink-2: #A3A7B0; --bad: #F06A5B;
  --font-cond: 'Barlow Condensed', 'Arial Narrow', sans-serif; --font-body: 'Barlow', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--space) radial-gradient(ellipse at 50% 120%, rgba(233,162,59,.16), transparent 60%) no-repeat;
  color: var(--ink); font: 400 16px/1.5 var(--font-body);
  display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px 16px;
}
main { width: 100%; max-width: 520px; background: var(--glass); border: 1px solid var(--line); border-left: 3px solid var(--amber); padding: 28px 26px 24px; }
.wordmark { font: 600 15px/1 var(--font-cond); letter-spacing: .30em; text-transform: uppercase; color: var(--amber); margin: 0 0 18px; }
h1 { font: 600 28px/1.15 var(--font-cond); letter-spacing: .02em; color: var(--ivory); margin: 0 0 12px; }
p { margin: 0 0 14px; color: var(--ink-2); }
p.lead { color: var(--ink); }
p.err { color: var(--bad); }
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 16px; }
.choice.single { grid-template-columns: 1fr; }
.choice div { border: 1px solid var(--line); padding: 10px 12px; min-width: 0; }
.choice span { display: block; font: 500 12px/1.3 var(--font-cond); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
.choice b { display: block; font: 600 18px/1.3 var(--font-cond); color: var(--ivory); overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 0; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 18px;
  font: 600 14px/1 var(--font-cond); letter-spacing: .14em; text-transform: uppercase; text-decoration: none;
  color: var(--ivory); background: transparent; border: 1px solid var(--line); cursor: pointer;
}
.btn:hover { border-color: var(--ivory); }
.btn.primary { background: var(--amber); border-color: var(--amber); color: var(--space); }
.btn.primary:hover { background: var(--amber-hi); border-color: var(--amber-hi); }
.file { margin: 20px 0 0; padding: 14px 0 0; border-top: 1px solid var(--line); }
.file label { display: block; font: 500 13px/1.4 var(--font-cond); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 8px; }
.file input { width: 100%; color: var(--ink-2); font: inherit; font-size: 14px; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--ivory); outline-offset: 2px; }
@media (max-width: 420px) { main { padding: 22px 16px 18px; } .choice { grid-template-columns: 1fr; } h1 { font-size: 24px; } }
</style>
<script src="js/migrate.js"></script>
</head>
<body>
<main>
  <div class="wordmark">Port Solace</div>
  <h1 id="head">Moving your station to portsolace.com</h1>
  <noscript><p class="err">Moving a station needs JavaScript. Turn it on for this site and reload the page.</p></noscript>
  <p id="msg" class="lead">Reading the station from the old address.</p>
  <div id="choice" class="choice" hidden>
    <div id="cell-here"><span>In this browser</span><b id="name-here"></b></div>
    <div><span>From the old address</span><b id="name-old"></b></div>
  </div>
  <div class="actions" id="actions">
    <button type="button" class="btn primary" id="btn-replace" hidden>Replace</button>
    <button type="button" class="btn" id="btn-keep" hidden>Keep this one</button>
    <button type="button" class="btn primary" id="btn-bring" hidden>Bring it over</button>
    <button type="button" class="btn" id="btn-cancel" hidden>Cancel</button>
    <button type="button" class="btn" id="btn-move" hidden>Bring your station from the old address</button>
    <a class="btn" id="btn-play" href="./" hidden>Play</a>
  </div>
  <div class="file" id="file" hidden>
    <label for="file-in">Have a port-solace-station.json file? Load it here</label>
    <input type="file" id="file-in" accept=".json,application/json">
  </div>
</main>
<script>
'use strict';
(function importStation() {
  const OLD = 'waystation', NEW = 'portsolace', PROFILE = 'portsolace.profile.v2', SESSION = 'portsolace.account';
  // the only keys a move writes (after mapping). Config overrides that carry an apiBase (portsolace.account.config,
  // portsolace.store, portsolace.push) and portsolace.migrated.v1 are dropped: a crafted link must not point the game
  // at another server.
  const MOVE_KEYS = ['portsolace.profile.v2', 'portsolace-save-v1', 'portsolace-save-v1.bak', 'portsolace.playerId',
    'portsolace.store.pending', 'portsolace.store.grants', 'portsolace.store.inflight', SESSION, 'portsolace.push.sub'];
  const MAX = 5 * 1024 * 1024;                    // characters: the whole payload, encoded or decoded
  const BRIDGE = 'https://joshanderson051.github.io/move/';
  const MOVE_HOSTS = ['portsolace.com', 'www.portsolace.com', 'localhost', '127.0.0.1'];
  const mapKey = (window.PortSolaceMigrate && typeof window.PortSolaceMigrate.mapKey === 'function')
    ? window.PortSolaceMigrate.mapKey
    : (k => (typeof k === 'string' && k.indexOf(OLD) === 0) ? NEW + k.slice(OLD.length) : k);
  const $ = id => document.getElementById(id);
  const el = { head: $('head'), msg: $('msg'), choice: $('choice'), cellHere: $('cell-here'), here: $('name-here'), old: $('name-old'), replace: $('btn-replace'), keep: $('btn-keep'), bring: $('btn-bring'), cancel: $('btn-cancel'), move: $('btn-move'), play: $('btn-play'), file: $('file'), fileIn: $('file-in') };
  let pending = null;                             // the mapped keys waiting on Bring it over / Replace

  function store() { try { return window.localStorage; } catch (e) { return null; } }
  function show(head, msg, opts) {
    const o = opts || {};
    el.head.textContent = head;
    el.msg.textContent = msg;
    el.msg.className = o.error ? 'err' : 'lead';
    el.choice.hidden = !(o.choice || o.single);
    el.choice.className = o.single ? 'choice single' : 'choice';
    el.cellHere.hidden = !!o.single;
    el.replace.hidden = !o.choice; el.keep.hidden = !o.choice;
    el.bring.hidden = !o.single; el.cancel.hidden = !o.single;
    el.play.hidden = !o.play;
    el.move.hidden = !(o.move && MOVE_HOSTS.indexOf(location.hostname) !== -1);
    el.file.hidden = !o.file;
  }
  function fail(msg) { show('The station could not be moved', msg, { error: true, play: true, move: true, file: true }); }
  function dropHash() {
    try { if (location.hash && history && typeof history.replaceState === 'function') history.replaceState(history.state == null ? null : history.state, '', location.pathname + location.search); } catch (e) { /* the hash stays; harmless */ }
  }

  // ---------------------------------------------------------- decoding (the bridge's 'g.' | 'j.' payload)
  function b64urlBytes(s) {
    if (!/^[A-Za-z0-9_-]*$/.test(s)) throw new Error('bad characters');
    const b = s.replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(b + '='.repeat((4 - (b.length % 4)) % 4));
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  async function gunzipText(bytes) {
    if (typeof DecompressionStream === 'undefined') throw new Error('This browser cannot unpack the station. Try a current Chrome, Edge, Firefox or Safari.');
    const reader = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip')).getReader();
    const dec = new TextDecoder();
    let text = '';
    for (;;) {
      const r = await reader.read();
      if (r.done) break;
      text += dec.decode(r.value, { stream: true });
      if (text.length > MAX) { try { reader.cancel(); } catch (e) { /* ignore */ } throw new Error('The station is larger than 5 MB.'); }
    }
    return text + dec.decode();
  }
  async function decodePayload(p) {
    if (p.length > MAX) throw new Error('The station is larger than 5 MB.');
    const kind = p.slice(0, 2), body = p.slice(2);
    if (kind === 'g.') return gunzipText(b64urlBytes(body));
    if (kind === 'j.') return new TextDecoder().decode(b64urlBytes(body));
    throw new Error('The link from the old address is not one this page understands.');
  }

  // ---------------------------------------------------------- validation: v 1, string values, waystation… names only; keeps MOVE_KEYS
  function mapped(text) {
    if (typeof text !== 'string' || text.length > MAX) throw new Error('The station is larger than 5 MB.');
    let data;
    try { data = JSON.parse(text); } catch (e) { throw new Error('The station data is not valid.'); }
    if (!data || typeof data !== 'object' || data.v !== 1) throw new Error('The station data is not valid.');
    const keys = data.keys;
    if (!keys || typeof keys !== 'object' || Array.isArray(keys)) throw new Error('The station data is not valid.');
    const out = {};
    let size = 0, count = 0;
    for (const k of Object.keys(keys)) {
      const v = keys[k];
      if (typeof k !== 'string' || k.indexOf(OLD) !== 0 || typeof v !== 'string') throw new Error('The station data is not valid.');
      const n = mapKey(k);
      if (typeof n !== 'string' || n.indexOf(NEW) !== 0) throw new Error('The station data is not valid.');
      size += n.length + v.length; count++;
      if (size > MAX) throw new Error('The station is larger than 5 MB.');
      if (MOVE_KEYS.indexOf(n) !== -1) out[n] = v;
    }
    return count && Object.keys(out).length ? out : null;
  }
  // the profile's station name (Meta: profile.sectors[profile.activeSector].name), read defensively
  function stationName(raw) {
    try {
      const p = JSON.parse(raw);
      const s = p && p.sectors && typeof p.activeSector === 'string' ? p.sectors[p.activeSector] : null;
      const n = s && typeof s.name === 'string' ? s.name.trim().slice(0, 40) : '';
      return n || 'Unnamed station';
    } catch (e) { return 'Unreadable station'; }
  }
  // the incoming station's name: the v2 profile, else the name in a v1 save
  function incomingName(keys) {
    if (typeof keys[PROFILE] === 'string') return stationName(keys[PROFILE]);
    for (const k of ['portsolace-save-v1', 'portsolace-save-v1.bak']) {
      if (typeof keys[k] !== 'string') continue;
      try { const s = JSON.parse(keys[k]); const n = s && typeof s.name === 'string' ? s.name.trim().slice(0, 40) : ''; if (n) return n; } catch (e) { /* fall through */ }
    }
    return 'Unnamed station';
  }

  // ---------------------------------------------------------- applying
  // replace: the player chose Replace over a different station here. Without it a sign-in already in this browser
  // (portsolace.account) stays as it is, so a link cannot swap the session.
  function write(keys, replace) {
    const ls = store();
    if (!ls) { fail('This browser is not letting the page save anything. Allow site data for portsolace.com and try again.'); return; }
    let session = null;
    try { session = ls.getItem(SESSION); } catch (e) { session = null; }
    const keepSession = !replace && session !== null && Object.prototype.hasOwnProperty.call(keys, SESSION) && keys[SESSION] !== session;
    try { for (const k of Object.keys(keys)) if (k.indexOf(NEW) === 0 && MOVE_KEYS.indexOf(k) !== -1 && !(keepSession && k === SESSION)) ls.setItem(k, keys[k]); }
    catch (e) { fail('This browser ran out of room to save the station. Free some site data and try again.'); return; }
    dropHash();
    show('Station moved', 'Opening Port Solace.', {});
    location.replace('./?moved=1');
  }
  function offer(keys) {
    const ls = store();
    let here = null;
    try { here = ls ? ls.getItem(PROFILE) : null; } catch (e) { here = null; }
    const incoming = Object.prototype.hasOwnProperty.call(keys, PROFILE) ? keys[PROFILE] : null;
    pending = keys;
    el.old.textContent = incomingName(keys);
    if (here !== null && incoming !== null && here !== incoming) {
      el.here.textContent = stationName(here);
      show('Moving your station to portsolace.com', 'Replace the station in this browser with the one from the old address?', { choice: true });
      el.replace.focus();
      return;
    }
    el.here.textContent = '';
    show('Moving your station to portsolace.com', 'Bring this station from the old address into this browser?', { single: true });
    el.bring.focus();
  }
  async function fromText(text) {
    let keys;
    try { keys = mapped(text); } catch (e) { fail(e.message); return; }
    if (!keys) { none(); return; }
    offer(keys);
  }
  function none() {
    dropHash();
    show('Nothing to move', 'No station was found at the old address in this browser.', { play: true, file: true });
  }

  el.replace.addEventListener('click', () => { const k = pending; pending = null; if (k) write(k, true); });
  el.keep.addEventListener('click', () => { pending = null; dropHash(); show('Kept your station', 'The station in this browser stays as it is.', { play: true }); });
  el.bring.addEventListener('click', () => { const k = pending; pending = null; if (k) write(k, false); });
  el.cancel.addEventListener('click', () => { pending = null; dropHash(); show('Nothing was moved', 'This browser stays as it was.', { play: true, move: true, file: true }); });
  el.move.addEventListener('click', () => { location.assign(BRIDGE + '?to=' + encodeURIComponent(new URL('import.html', location.href).href)); });
  el.fileIn.addEventListener('change', () => {
    const f = el.fileIn.files && el.fileIn.files[0];
    el.fileIn.value = '';
    if (!f) return;
    if (f.size > MAX) { fail('That file is larger than 5 MB.'); return; }
    f.text().then(fromText, () => fail('That file could not be read.'));
  });

  // ---------------------------------------------------------- start
  const hash = location.hash || '';
  const TAG = '#ps-import=';
  window.addEventListener('hashchange', () => { if (location.hash.indexOf(TAG) === 0) location.reload(); });   // a second hand-off into an open tab
  if (hash.indexOf(TAG) !== 0) {
    show('Moving your station to portsolace.com', 'Played at the old address? Bring the station saved in this browser over here, or load a port-solace-station.json file.', { play: true, move: true, file: true });
    return;
  }
  const payload = hash.slice(TAG.length);
  dropHash();                                     // the station data does not stay in the address bar or history
  if (payload === 'none') { none(); return; }
  decodePayload(payload).then(fromText, e => fail(e && e.message ? e.message : 'The station data is not valid.'));
})();
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Port Solace mark: the Core Hub icon from js/art.js ICONS (hexagon plate, inner ring, lamp core), amber on void.
       Drawn a little heavier than the icon (2.4 against 1.75, the ring a touch smaller) so the hexagon and the ring stay
       apart at 16 px in a browser tab; the large app icons in assets/ keep the icon's own weight. -->
  <rect width="32" height="32" rx="6" fill="#04050A"/>
  <g transform="translate(4 4)" fill="none" stroke="#E9A23B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5 20.23 7.25v9.5L12 21.5l-8.23-4.75v-9.5Z"/>
    <path d="M15.8 12a3.8 3.8 0 1 1-7.6 0 3.8 3.8 0 0 1 7.6 0Z"/>
  </g>
  <circle cx="16" cy="16" r="1.5" fill="#FFE9B8"/>
</svg>

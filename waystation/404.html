<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No such berth — Waystation</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#04050A">
<!-- Self-contained on purpose: a 404 is served at any depth, so nothing here is a relative URL except the two links,
     which a short script points at the site root (the GitHub Pages project prefix, or / on a custom domain). -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2304050A'/%3E%3Cg transform='translate(4 4)' fill='none' stroke='%23E9A23B' stroke-width='1.75' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 2.5 20.23 7.25v9.5L12 21.5l-8.23-4.75v-9.5Z'/%3E%3Cpath d='M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='1.5' fill='%23FFE9B8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{--void:#04050A;--bg:#090B12;--surface-1:#0F1119;--surface-2:#161A25;--surface-3:#1E2432;--hairline:#262C3A;--hairline-2:#343B4C;
        --amber:#E9A23B;--amber-hi:#FFC46A;--ivory:#F3E9D6;--warn:#FF8F3D;--ink:#E6E8EC;--ink-2:#A3A7B0;--ink-3:#6B707C;--on-accent:#140C00;
        --font-cond:'Barlow Condensed','Bahnschrift Condensed','Arial Narrow',sans-serif;--font-body:'Barlow','Segoe UI',system-ui,sans-serif;--font-mono:'JetBrains Mono','Cascadia Mono',Consolas,monospace}
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--void);color:var(--ink);font:400 13px/1.45 var(--font-body);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  :focus-visible{outline:2px solid var(--ivory);outline-offset:2px}
  .col{display:flex;flex-direction:column;align-items:center;gap:14px;width:420px;max-width:100%}
  .wordmark{font:600 56px/1 var(--font-cond);letter-spacing:.30em;text-transform:uppercase;color:var(--ivory);margin:0 -.30em 0 0}
  .section{font:600 12px/1 var(--font-cond);letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
  .panel{position:relative;width:100%;background:var(--surface-1);padding:20px 24px 20px 28px;margin-top:6px}
  .panel::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:4px;background:var(--amber);clip-path:polygon(0 4px,100% 0,100% calc(100% - 4px),0 100%)}
  .label{display:block;font:500 11px/14px var(--font-cond);letter-spacing:.10em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
  .path{font:500 14px/32px var(--font-mono);color:var(--ink);background:var(--surface-2);border:1px solid var(--hairline);border-radius:3px;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .note{margin:10px 0 0;color:var(--warn)}
  .note::before{content:'\25A0';font-size:8px;margin-right:6px;vertical-align:1px}
  .micro{font:500 10px/12px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:8px}
  .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  .btn{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:28px;padding:0 12px 0 14px;border-radius:3px;background:var(--surface-2);border:1px solid var(--hairline);color:var(--ink);text-decoration:none;font:600 12px/1 var(--font-cond);letter-spacing:.08em;text-transform:uppercase}
  .btn::before{content:'';position:absolute;left:4px;top:4px;bottom:4px;width:2px;background:var(--amber)}
  .btn:hover{border-color:var(--hairline-2);background:var(--surface-3)}
  .btn.primary{background:var(--amber);border-color:var(--amber);color:var(--on-accent);padding:0 12px}
  .btn.primary::before{display:none}
  .btn.primary:hover{background:var(--amber-hi);border-color:var(--amber-hi)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
  .btn.ghost::before{background:var(--hairline-2)}
  .btn.ghost:hover{color:var(--ink)}
  @media (max-width:480px){.wordmark{font-size:40px}}
</style>
</head>
<body>
  <main class="col">
    <h1 class="wordmark">Waystation</h1>
    <div class="section">Registry error &middot; 404</div>
    <div class="panel">
      <span class="label">Requested berth</span>
      <div class="path" id="path">/</div>
      <p class="note">No module answers at this address.</p>
      <div class="micro">The station manifest lists the landing page and the game only.</div>
      <div class="actions">
        <a class="btn ghost" id="home" href="/">Landing</a>
        <a class="btn primary" id="play" href="/play/">Play</a>
      </div>
    </div>
  </main>
  <script>
    (function () {
      var p = location.pathname;
      document.getElementById('path').textContent = p;
      // Site root: the first path segment when this is a GitHub Pages project site (user.github.io/<repo>/), else "/".
      var root = /\.github\.io$/i.test(location.hostname) ? (p.match(/^\/[^/]+\//) || ['/'])[0] : '/';
      document.getElementById('home').href = root;
      document.getElementById('play').href = root + 'play/';
    })();
  </script>
</body>
</html>

# Publishes the waystation/ folder to GitHub Pages on every push to main.
# Port Solace: the custom domain portsolace.com is set in Settings > Pages (an Actions deploy ignores a CNAME file).
# Pages must be set to "GitHub Actions" as its source (Settings > Pages), which `gh api` did on first deploy.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the static site (drops docs, dev previews and tooling)
        run: bash scripts/dist.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
